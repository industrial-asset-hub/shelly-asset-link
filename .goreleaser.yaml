version: 2

project_name: shelly-asset-link

before:
  hooks:
    - go generate ./...
    - go mod vendor

builds:
  - id: shelly-asset-link
    binary: shelly-asset-link
    tags:
      - webserver
    flags:
      - -trimpath
    ldflags:
      - -s -w -extldflags '-static'

      - -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}}

    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [ 'tar.gz' ]
    files:
      - vendor\
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [ 'zip' ]



nfpms:
  - id: shelly-asset-link
    package_name: shelly-asset-link
    ids:
      - shelly-asset-link
    vendor: Michael Leipold
    homepage: https://github.com/mlp0911
    maintainer: Michael Leipold <https://github.com/mlp0911>
    description: |-
      Shelly Asset Link
    license: 2026 Michael Leipold (https://github.com/mlp0911)
    formats:
      - deb
    bindir: /usr/bin
    version_metadata: git
    section: default
    priority: extra
    contents:
      - src: contrib/shelly-asset-link.service
        dst: /lib/systemd/system/shelly-asset-link.service
        type: "config"
    scripts:
      postinstall: "contrib/postinstall.bash"
      postremove: "contrib/postremove.bash"


checksum:
  name_template: "{{.ProjectName}}_{{.Version}}.sha256"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev.{{ .ShortCommit }}"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
