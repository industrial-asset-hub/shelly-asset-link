name: Prepare Environment
description: Setup Go and install dependencies

inputs:
  go-version:
    description: 'Desired Go version'
    required: false
    default: 'stable'
  download-al-ctl:
    description: 'Download al-ctl binary for testing'
    required: false
    default: 'false'

# outputs:

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: stable
    - name: Install Dependencies
      shell: bash
      run: |
        export GOPATH=$HOME/go
        export PATH=$PATH:$GOROOT/bin:$GOPATH/bin
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.1
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
        go install github.com/atombender/go-jsonschema@v0.16.0
    - name: Set Environment Variables
      shell: bash
      run: |
          echo "OS_NAME=${{ runner.os }}" >> $GITHUB_ENV
          if [ "${{ runner.arch }}" == "X64" ]; then
            echo "ARCH_NAME=x86_64" >> $GITHUB_ENV
          elif [ "${{ runner.arch }}" == "ARM64" ]; then
            echo "ARCH_NAME=arm64" >> $GITHUB_ENV
          else
            echo "ARCH_NAME=${{ runner.arch }}" >> $GITHUB_ENV
          fi
    - name: Download and Setup al-ctl
      if: inputs.download-al-ctl == 'true'
      shell: bash
      run: |
          # Map GitHub runner.os to release naming convention
          if [ "${{ runner.os }}" == "Linux" ]; then
            OS_RELEASE="Linux"
          elif [ "${{ runner.os }}" == "macOS" ]; then
            OS_RELEASE="Darwin"
          else
            OS_RELEASE="${{ runner.os }}"
          fi
          
          # Map architecture
          if [ "${{ runner.arch }}" == "X64" ]; then
            ARCH_RELEASE="x86_64"
          elif [ "${{ runner.arch }}" == "ARM64" ]; then
            ARCH_RELEASE="arm64"
          else
            ARCH_RELEASE="${{ runner.arch }}"
          fi
          
          echo "Downloading al-ctl for ${OS_RELEASE}_${ARCH_RELEASE}..."
          curl -L -o al-ctl.tar.gz https://github.com/industrial-asset-hub/asset-link-sdk/releases/download/v3.6.2/al-ctl_${OS_RELEASE}_${ARCH_RELEASE}.tar.gz
          tar -xf al-ctl.tar.gz
          chmod +x al-ctl
          echo "al-ctl downloaded and ready to use"
